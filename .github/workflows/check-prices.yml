name: Check provider prices

on:
  schedule:
    # Monday 06:00 UTC — early enough to land before EU business hours.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch latest prices
        id: fetch
        # Don't fail the job here — we want the summary + issue/PR steps to run
        # even on per-fetcher errors. The script's exit code is still recorded
        # in steps.fetch.outcome.
        continue-on-error: true
        run: npm run fetch-prices

      - name: Read fetch summary
        id: summary
        if: always()
        run: |
          if [ ! -f .fetch-summary.json ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          errs=$(node -e "const s=require('./.fetch-summary.json');const lines=[...(s.results||[]).flatMap(r=>r.errors.map(e=>r.provider+': '+e)),...(s.validationErrors||[]).map(e=>'validation: '+e)];console.log(lines.join('\n'))")
          if [ -n "$errs" ]; then
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "errors<<SUMMARY_EOF"
            echo "$errs"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Detect data change
        id: changes
        if: always()
        run: |
          if git diff --quiet -- data/providers.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with updated prices
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: prices/auto-update
          delete-branch: true
          commit-message: 'chore(prices): weekly refresh from upstream sources'
          title: 'chore(prices): weekly refresh'
          body: |
            Automated price refresh from AWS Bulk Pricing API, Hetzner API,
            MasterDC + Forpsi HTML scrape, and ECB FX rates.

            **Per-provider errors (if any):**
            ```
            ${{ steps.summary.outputs.errors }}
            ```

            Review the diff in `data/providers.json` and merge to deploy.
            Cloudflare Pages will redeploy automatically on push to `main`.
          add-paths: |
            data/providers.json

      - name: Open / update issue on fetch errors
        if: steps.summary.outputs.has_errors == 'true' || (steps.fetch.outcome == 'failure' && steps.summary.outputs.exists != 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Price fetcher: errors during last run';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = `Run: ${runUrl}\n\n`;
            if (fs.existsSync('.fetch-summary.json')) {
              const s = JSON.parse(fs.readFileSync('.fetch-summary.json', 'utf8'));
              const errLines = (s.results || []).flatMap(r => r.errors.map(e => `- **${r.provider}**: ${e}`));
              const valLines = (s.validationErrors || []).map(e => `- ${e}`);
              if (errLines.length) body += `## Fetcher errors\n${errLines.join('\n')}\n\n`;
              if (valLines.length) body += `## Validation errors (providers.json not written)\n${valLines.join('\n')}\n\n`;
            } else {
              body += `Fetcher exited non-zero without writing a summary file. Check the run log.`;
            }
            const list = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const match = list.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
              });
            }

      - name: Fail run if no fetcher succeeded
        if: steps.fetch.outcome == 'failure' && steps.changes.outputs.changed != 'true'
        run: |
          echo "Fetcher exited non-zero and no data changed — failing the run for visibility."
          exit 1
