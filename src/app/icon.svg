<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KalkulackaHostingu.cz">
  <title>KalkulackaHostingu.cz</title>
  <!--
    Mark concept: cloud (= cloud hosting, sits where the č háček of "Kč" lives)
    over three descending bars (= price comparison chart, also reads as "K").
    Shortest bar in success green = the cheapest provider wins.
  -->
  <g fill="#0066FF">
    <circle cx="20" cy="13" r="6"/>
    <circle cx="32" cy="9"  r="8"/>
    <circle cx="44" cy="13" r="6"/>
    <rect x="14" y="12" width="36" height="8" rx="4"/>
  </g>
  <rect x="14" y="24" width="8"  height="36" rx="2" fill="#0066FF"/>
  <rect x="28" y="32" width="8"  height="28" rx="2" fill="#0066FF"/>
  <rect x="42" y="40" width="8"  height="20" rx="2" fill="#10B981"/>
</svg>
